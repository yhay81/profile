name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality checks
        run: pnpm lint
      - name: Run security audit
        run: pnpm security:audit
      - name: Build with Astro
        run: pnpm build
      - name: Verify identity artifacts
        run: node dist/.well-known/verify-identity.mjs --artifact-dir dist --local-only --report identity-health.json
      - name: Package reproducible site artifact
        if: github.event_name == 'push'
        shell: bash
        run: tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C dist . | gzip -n > site-dist.tar.gz
      - name: Attest site artifact provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: site-dist.tar.gz
      - name: Upload verifiable site artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist-${{ github.sha }}
          path: site-dist.tar.gz
          retention-days: 30
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
