name: Sync published writing

on:
  schedule:
    - cron: "31 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-published-writing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync official Zenn feed
        run: pnpm sync:writing
      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/zenn-writing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate updated snapshot
        if: steps.changes.outputs.changed == 'true'
        run: pnpm check && pnpm build
      - name: Publish synchronization PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/sync-published-writing"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add src/data/zenn-writing.json
          git commit -m "Sync published writing"
          git push --force-with-lease --set-upstream origin "$branch"

          pr_url="$(gh pr list \
            --base main \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url')"
          if [[ -z "$pr_url" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Sync published writing" \
              --body "Updates the committed writing snapshot from the official Zenn RSS feed. The synchronization workflow ran the full quality and reproducible-build checks before opening this PR."
          fi
