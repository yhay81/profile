name: Deploy Astro site to Cloudflare

# Pull requests run the checks and the reproducible build. A manual run from
# main repeats them for the merged commit, then attests and deploys exactly
# what it built. Merging alone deploys nothing.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality checks
        run: pnpm lint
      - name: Verify dependency security
        run: pnpm security:check
      - name: Build and enforce performance contract
        run: pnpm build
      - name: Verify and package reproducible site artifact
        shell: bash
        run: |
          create_identity_release() {
            revision="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/.well-known/identity.json')); process.stdout.write(String(m.releaseRevision))")"
            release_dir="dist/.well-known/releases"
            release_archive="$release_dir/identity-release-r${revision}.tar.gz"
            rm -rf "$release_dir"
            mkdir -p "$release_dir"

            release_paths=(
              .well-known/identity.json
              .well-known/identity-history.json
              .well-known/verify-identity.mjs
              .well-known/schemas
              .well-known/attestations
              .well-known/history
              .well-known/security.txt
              .well-known/release.json
              proofs
              pgp-key.asc
            )
            optional_paths=(
              .well-known/identity.json.asc
              .well-known/identity-root.json
              .well-known/identity-root.dsse.json
            )
            for path in "${optional_paths[@]}"; do
              if [[ -e "dist/$path" ]]; then
                release_paths+=("$path")
              fi
            done

            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -cf - -C dist "${release_paths[@]}" | gzip -n > "$release_archive"
          }

          create_archive() {
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C dist . \
              | gzip -n > "$1"
          }

          create_identity_release
          cp dist/.well-known/releases/identity-release-r*.tar.gz "$RUNNER_TEMP/identity-release-first.tar.gz"
          create_archive "$RUNNER_TEMP/site-dist-first.tar.gz"
          pnpm build
          create_identity_release
          create_archive site-dist.tar.gz

          first_identity_digest="$(sha256sum "$RUNNER_TEMP/identity-release-first.tar.gz" | cut -d ' ' -f 1)"
          second_identity_digest="$(sha256sum dist/.well-known/releases/identity-release-r*.tar.gz | cut -d ' ' -f 1)"
          first_digest="$(sha256sum "$RUNNER_TEMP/site-dist-first.tar.gz" | cut -d ' ' -f 1)"
          second_digest="$(sha256sum site-dist.tar.gz | cut -d ' ' -f 1)"
          echo "first identity release:  $first_identity_digest"
          echo "second identity release: $second_identity_digest"
          echo "first build:  $first_digest"
          echo "second build: $second_digest"
          test "$first_identity_digest" = "$second_identity_digest"
          test "$first_digest" = "$second_digest"
          sha256sum \
            dist/.well-known/identity.json \
            dist/.well-known/releases/identity-release-r*.tar.gz \
            site-dist.tar.gz > release-subjects.sha256
          mkdir -p release
      - name: Generate deployed-site SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: release/site.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify identity artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dist/.well-known/verify-identity.mjs --artifact-dir dist --local-only --report identity-health.json
      - name: Upload verifiable site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist-${{ github.sha }}
          path: site-dist.tar.gz
          retention-days: 30
      - name: Upload identity attestation subjects
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-subjects-${{ github.sha }}
          path: |
            dist/.well-known/identity.json
            dist/.well-known/releases/identity-release-r*.tar.gz
            release/site.spdx.json
            release-subjects.sha256
          retention-days: 30

  attest:
    if: github.ref == 'refs/heads/main'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    timeout-minutes: 1
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download site attestation subject
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist-${{ github.sha }}
      - name: Download identity attestation subjects
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: identity-subjects-${{ github.sha }}
      - name: Attest identity manifest, release archive, and site provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-subjects.sha256
      - name: Attest deployed-site SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: site-dist.tar.gz
          sbom-path: release/site.spdx.json

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://yusuke-hayashi.com
    permissions:
      attestations: read
      contents: read
    timeout-minutes: 1
    runs-on: ubuntu-latest
    needs: [build, attest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download attested site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist-${{ github.sha }}
      - name: Extract and verify deployment artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_attestation() {
            gh attestation verify "$1" \
              --repo yhay81/profile \
              --signer-workflow yhay81/profile/.github/workflows/cloudflare.yml \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners
          }

          verify_attestation site-dist.tar.gz
          mkdir dist
          tar -xzf site-dist.tar.gz -C dist
          verify_attestation dist/.well-known/identity.json
          verify_attestation dist/.well-known/releases/identity-release-r*.tar.gz
          node dist/.well-known/verify-identity.mjs \
            --artifact-dir dist \
            --local-only \
            --report identity-health.json
      - name: Deploy static assets to Cloudflare
        run: pnpm deploy:cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify-deployment:
    if: github.ref == 'refs/heads/main'
    permissions:
      attestations: read
      contents: read
    timeout-minutes: 1
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Verify published release and identity resources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_attestation() {
            gh attestation verify "$1" \
              --repo yhay81/profile \
              --signer-workflow yhay81/profile/.github/workflows/cloudflare.yml \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners
          }

          verify_once() {
            curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              'https://yusuke-hayashi.com/.well-known/verify-identity.mjs' \
              --output verify-identity.mjs \
              && node verify-identity.mjs --local-only --report identity-health.json \
              && node scripts/verify-release.mjs \
                  --base-url https://yusuke-hayashi.com \
                  --expected-commit "$GITHUB_SHA" \
              && revision="$(node -e "fetch('https://yusuke-hayashi.com/.well-known/identity.json',{headers:{'Cache-Control':'no-cache'}}).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()}).then(m=>process.stdout.write(String(m.releaseRevision)))")" \
              && curl --fail --silent --show-error \
                --header 'Cache-Control: no-cache' \
                "https://yusuke-hayashi.com/.well-known/identity.json" \
                --output identity.json \
              && curl --fail --silent --show-error \
                --header 'Cache-Control: no-cache' \
                "https://yusuke-hayashi.com/.well-known/releases/identity-release-r${revision}.tar.gz" \
                --output "identity-release-r${revision}.tar.gz" \
              && verify_attestation identity.json \
              && verify_attestation "identity-release-r${revision}.tar.gz"
          }

          for attempt in {1..12}; do
            if verify_once; then
              exit 0
            fi

            if [[ "$attempt" -lt 12 ]]; then
              sleep 10
            fi
          done

          exit 1
      - name: Verify production security headers
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --header 'Cache-Control: no-cache' \
            --dump-header response-headers.txt \
            --output response-body.html \
            'https://yusuke-hayashi.com/'
          grep --ignore-case --quiet '^content-security-policy:' response-headers.txt
          grep --ignore-case --quiet '^strict-transport-security:' response-headers.txt
          grep --ignore-case --quiet '^x-content-type-options: nosniff' response-headers.txt
          grep --ignore-case --quiet '^x-frame-options: DENY' response-headers.txt
          ! grep --quiet 'static.cloudflareinsights.com\|data-cf-beacon\|/cdn-cgi/rum' response-body.html
      - name: Upload deployment health report
        if: always() && hashFiles('identity-health.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-health-${{ github.sha }}
          path: identity-health.json
          retention-days: 30
