# Hold new package releases for 24 hours and fail closed if registry publication
# metadata is unavailable. Security fixes can use a version-specific exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

strictPeerDependencies: true

# Explicit build-script policy in pnpm's allowBuilds format.
allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  unrs-resolver: false
  workerd: true

# @astrojs/astro2tsx 0.1.3 pins @emnapi/core but leaves @emnapi/runtime, a peer
# of its wasm runtime, undeclared. Declare the matching release so pnpm does not
# reuse the 2.0 beta pinned by rolldown's wasm binding, which crashes astro check.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": "1.11.3"

# Pin vulnerable transitive dependencies to their patched releases as well.
overrides:
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11. ESLint, its config
  # array, typescript-estree and jsx-a11y-x call only minimatch() and
  # Minimatch#match(), which 11 keeps; its removed APIs (makeRe, regexp, AST)
  # are unused here.
  "minimatch@>=7.0.0 <11.0.1": "11.0.5"
