# Hold new package releases for 24 hours and fail closed if registry publication
# metadata is unavailable. Security fixes can use a version-specific exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  # @astrojs/check 0.9.9 requires chokidar 4. Its final release predates npm
  # provenance, but its registry signature is verified by security:signatures.
  - chokidar@4.0.3

strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # jsx-a11y has not widened its peer declaration for ESLint 10 yet. The
    # strict rule set is exercised by this repository's lint and Astro checks.
    "eslint-plugin-jsx-a11y@6.10.2>eslint": "10"

# Explicit build-script policy using pnpm 11's allowBuilds format.
allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  unrs-resolver: false
  workerd: true

# Pin vulnerable transitive dependencies to their patched releases as well.
overrides:
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0"
  "flatted@<=3.4.1": "3.4.2"
  "css-tree@<3.2.1": "3.2.1"
  "fast-uri@>=3.0.0 <3.1.5": "3.1.5"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "nanoid@<3.3.17": "3.3.17"
  "postcss@<=8.5.22": "8.5.23"
  "undici@>=7.0.0 <7.29.0": "7.29.0"
