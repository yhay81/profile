# pnpm 11 の既定(公開後 24h 未満のパッケージを拒否)を無効化し、
# リリース直後でも最新版を採用する
minimumReleaseAge: 0

# ビルドスクリプトの許可(pnpm 11 の allowBuilds 形式)
allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  unrs-resolver: false
  workerd: true

# 直接依存だけでなく、監査対象の推移的依存も修正版に統一する。
overrides:
  "brace-expansion@<=5.0.7": "5.0.8"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0"
  "flatted@<=3.4.1": "3.4.2"
  "css-tree@<3.2.1": "3.2.1"
