# Hold new package releases for 24 hours and fail closed if registry publication
# metadata is unavailable. Security fixes can use a version-specific exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # Upstream PRs widening peerDependencies for Stylelint 18 are still open.
    # Both plugins use only createPlugin/utils APIs unchanged in 18 and are
    # exercised by pnpm check.
    "stylelint-declaration-block-no-ignored-properties@3.0.0>stylelint": "18"
    "stylelint-high-performance-animation@2.0.0>stylelint": "18"

# Explicit build-script policy in pnpm's allowBuilds format.
allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  unrs-resolver: false
  workerd: true

# Pin vulnerable transitive dependencies to their patched releases as well.
overrides:
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11. ESLint, its config
  # array, typescript-estree and jsx-a11y-x call only minimatch() and
  # Minimatch#match(), which 11 keeps; its removed APIs (makeRe, regexp, AST)
  # are unused here.
  "minimatch@>=7.0.0 <11.0.8": "11.0.8"
