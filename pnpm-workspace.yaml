# Disable pnpm 11's default rejection of packages published less than 24 hours
# ago so the project can adopt current releases immediately.
minimumReleaseAge: 0

# Explicit build-script policy using pnpm 11's allowBuilds format.
allowBuilds:
  esbuild: true
  sharp: true
  "@parcel/watcher": false
  unrs-resolver: false
  workerd: true

# Pin vulnerable transitive dependencies to their patched releases as well.
overrides:
  "brace-expansion@<=5.0.7": "5.0.8"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=9.0.0 <9.0.7": "9.0.7"
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0"
  "flatted@<=3.4.1": "3.4.2"
  "css-tree@<3.2.1": "3.2.1"
